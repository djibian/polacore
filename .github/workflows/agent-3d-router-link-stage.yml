# Temporary promotion workflow; self-removes after exact verified promotion.
name: PolaCore 3D Router Link Promote

on:
  pull_request:
    branches: [engineering]
    types: [synchronize]
    paths:
      - '.github/workflows/agent-3d-router-link-stage.yml'

permissions:
  contents: read

jobs:
  promote:
    if: github.event.pull_request.number == 37 && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Promote exact strict Router wiring and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          op_path=Path('.github/workflows/agent-real-task-v1.yml')
          op=op_path.read_text(encoding='utf-8')
          old='opencode run --agent router --model albert/deepseek-v4-flash --format json'
          new='opencode run --agent router-task-3d --model albert/deepseek-v4-flash --format json'
          if op.count(old) != 1:
              raise SystemExit(f'operational Router call mismatch: {op.count(old)}')
          op=op.replace(old,new)
          trigger="      - '.opencode/agents/reviewer-task-3d.md'\n"
          if op.count(trigger) != 1:
              raise SystemExit('operational trigger anchor mismatch')
          op=op.replace(trigger, trigger+"      - '.opencode/agents/router-task-3d.md'\n", 1)
          op_path.write_text(op,encoding='utf-8')

          contract_path=Path('.github/workflows/agent-real-task-v1-contract.yml')
          contract=contract_path.read_text(encoding='utf-8')
          if contract.count(trigger) != 1:
              raise SystemExit('contract trigger anchor mismatch')
          contract=contract.replace(trigger, trigger+"      - '.opencode/agents/router-task-3d.md'\n", 1)
          anchor="          reviewer=frontmatter('.opencode/agents/reviewer-task-3d.md')\n"
          if contract.count(anchor) != 1:
              raise SystemExit('Router assertion anchor mismatch')
          checks="""          router=frontmatter('.opencode/agents/router-task-3d.md')
          rtp=router.fetch('permission')
          rread=rtp.fetch('read')
          abort '3D Router must use DeepSeek' unless router['model']=='albert/deepseek-v4-flash'
          abort '3D Router wildcard read must deny' unless rread['*']=='deny'
          %w[AGENTS.md agent-input/router-context.md].each do |path|
            abort \"3D Router read missing: #{path}\" unless rread[path]=='allow'
          end
          %w[glob grep list edit bash task skill lsp webfetch websearch external_directory question todowrite].each do |tool|
            abort \"3D Router tool must deny: #{tool}\" unless rtp[tool]=='deny'
          end
"""
          contract=contract.replace(anchor, checks+anchor, 1)
          grep_anchor="          grep -F \"github.event.issue.number == 36\" .github/workflows/agent-real-task-v1.yml >/dev/null\n"
          if contract.count(grep_anchor) != 1:
              raise SystemExit('Router call grep anchor mismatch')
          contract=contract.replace(grep_anchor, grep_anchor+"          grep -F 'opencode run --agent router-task-3d --model albert/deepseek-v4-flash --format json' .github/workflows/agent-real-task-v1.yml >/dev/null\n", 1)
          contract_path.write_text(contract,encoding='utf-8')
          PY

          ruby -e "require 'psych'; ARGV.each { |p| Psych.parse_file(p) }" \
            .github/workflows/agent-real-task-v1.yml \
            .github/workflows/agent-real-task-v1-contract.yml
          grep -F "opencode run --agent router-task-3d --model albert/deepseek-v4-flash --format json" .github/workflows/agent-real-task-v1.yml >/dev/null
          grep -F "'.opencode/agents/router-task-3d.md'" .github/workflows/agent-real-task-v1.yml .github/workflows/agent-real-task-v1-contract.yml >/dev/null

          git rm .github/workflows/agent-3d-deepseek-probe.yml .github/workflows/agent-3d-router-link-stage.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/agent-real-task-v1.yml .github/workflows/agent-real-task-v1-contract.yml
          staged="$(git diff --cached --name-status | sort)"
          printf '%s\n' "$staged"
          test "$(printf '%s\n' "$staged" | wc -l)" -eq 4
          git commit -m 'infra: wire strict DeepSeek Router into real task v1'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
