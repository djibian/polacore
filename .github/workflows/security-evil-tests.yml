name: Security Evil Tests

on:
  push:
    branches: [engineering]
    paths:
      - 'tests/evil/**'
      - 'tests/fixtures/oci/**'
      - 'security/**'
      - '.github/workflows/security-evil-tests.yml'
  pull_request:
    paths:
      - 'tests/evil/**'
      - 'tests/fixtures/oci/**'
      - 'security/**'
      - '.github/workflows/security-evil-tests.yml'

permissions:
  contents: read

jobs:
  security-evil-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run SecurityFloor persistence probes
        run: bash tests/evil/run_persistent_credential_authority.sh
      - name: Enforce RuntimeConfinementProfile, OCI and bundle mutations
        run: python3 tests/evil/test_runtime_confinement_policy.py
      - name: Lint canonical Standard v0 OCI deployment bundle
        run: python3 security/lint_runtime_config.py --bundle tests/fixtures/oci
      - name: Prove path reopen TOCTOU and retained O_PATH identity
        run: python3 tests/evil/bundle_toctou_binding.py
      - name: Probe fd-bound detached mount semantics when permitted
        run: python3 tests/evil/mount_fd_binding_probe.py
      - name: Exercise narrow P117 source acquisition
        run: bash tests/evil/run_source_acquisition.sh
