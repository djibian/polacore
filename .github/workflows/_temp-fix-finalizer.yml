name: Temporary Finalizer Repair

on:
  push:
    branches: [infra/fix-ci-reviewer-finalizer]
    paths:
      - '.github/workflows/_temp-fix-finalizer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: infra/fix-ci-reviewer-finalizer

      - name: Apply exact finalizer repair and regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          router_path = Path('.github/workflows/agent-router.yml')
          router = router_path.read_text(encoding='utf-8')
          start_marker = "              printf '%s' \"$REVIEW_DECISION_B64\" | base64 --decode > /tmp/reviewer-decision.json\n"
          end_marker = "              esac\n"
          if router.count(start_marker) != 1:
              raise SystemExit('unexpected finalizer start marker count')
          start = router.index(start_marker)
          end = router.index(end_marker, start) + len(end_marker)
          replacement = '''              printf '%s' "$REVIEW_DECISION_B64" | base64 --decode > /tmp/reviewer-decision.json
              jq -e '\''
                type == "object" and
                (keys == ["confidence","rationale","verdict"]) and
                (.verdict == "READY_FOR_HUMAN" or .verdict == "CHANGES_REQUIRED" or .verdict == "BLOCKED") and
                (.confidence | type == "number") and
                (.confidence >= 0 and .confidence <= 1) and
                (.rationale | type == "string") and
                (.rationale | length >= 20 and length <= 800)
              '\'' /tmp/reviewer-decision.json >/dev/null || {
                echo 'finalizer rejected Reviewer decision' >&2
                exit 1
              }
              verdict="$(jq -r '.verdict' /tmp/reviewer-decision.json)"
              printf -v confidence '%.2f' "$(jq -r '.confidence' /tmp/reviewer-decision.json)"
              rationale="$(jq -r '.rationale' /tmp/reviewer-decision.json)"
              case "$verdict" in
                READY_FOR_HUMAN) state_label='agent:ready-for-human' ;;
                CHANGES_REQUIRED) state_label='agent:changes-required' ;;
                BLOCKED) state_label='agent:review-blocked' ;;
                *) exit 1 ;;
              esac
'''
          router_path.write_text(router[:start] + replacement + router[end:], encoding='utf-8')

          contract_path = Path('.github/workflows/agent-ci-reviewer-canary-contract.yml')
          contract = contract_path.read_text(encoding='utf-8')
          needle = "          python3 -m py_compile scripts/agent_router_validate.py scripts/agent_reviewer_validate.py\n          echo 'CI/Reviewer workflow structure and authority boundaries verified.'\n"
          if contract.count(needle) != 1:
              raise SystemExit('unexpected contract insertion marker count')
          replacement = '''          python3 -m py_compile scripts/agent_router_validate.py scripts/agent_reviewer_validate.py

          ruby -e "require 'psych'; y=Psych.safe_load_file(ARGV[0], aliases: true); step=y.fetch('jobs').fetch('finalize').fetch('steps').find { |s| s['id'] == 'final' }; File.write('/tmp/finalizer.sh', step.fetch('run'))" .github/workflows/agent-router.yml
          bash -n /tmp/finalizer.sh
          cat > /tmp/reviewer-decision.json <<'EOF'
          {"verdict":"READY_FOR_HUMAN","confidence":0.95,"rationale":"Synthetic validated Reviewer decision for deterministic finalizer contract execution."}
          EOF
          decision_b64="$(base64 -w0 /tmp/reviewer-decision.json)"
          : > /tmp/finalizer-output
          CI_JOB_RESULT=success \\
            CI_RESULT=PASS \\
            REVIEWER_JOB_RESULT=success \\
            REVIEW_DECISION_B64="$decision_b64" \\
            GITHUB_OUTPUT=/tmp/finalizer-output \\
            bash /tmp/finalizer.sh
          grep -Fx 'state_label=agent:ready-for-human' /tmp/finalizer-output >/dev/null
          grep -Fx 'verdict=READY_FOR_HUMAN' /tmp/finalizer-output >/dev/null
          grep -Fx 'confidence=0.95' /tmp/finalizer-output >/dev/null
          grep -Fx 'ci_passed=true' /tmp/finalizer-output >/dev/null
          echo 'CI/Reviewer workflow structure, authority boundaries, and finalizer handoff verified.'
'''
          contract_path.write_text(contract.replace(needle, replacement), encoding='utf-8')
          PY

          ruby -e "require 'psych'; ARGV.each { |p| Psych.parse_file(p) }" \
            .github/workflows/agent-router.yml \
            .github/workflows/agent-ci-reviewer-canary-contract.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/agent-ci-reviewer-canary-contract.yml' '.github/workflows/agent-router.yml' | sort)"
          test "$changed" = "$expected" || { printf 'unexpected changed files:\n%s\n' "$changed" >&2; exit 1; }

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/agent-router.yml .github/workflows/agent-ci-reviewer-canary-contract.yml
          git commit -m 'fix: validate CI Reviewer finalizer handoff'
          git push origin HEAD:infra/fix-ci-reviewer-finalizer
