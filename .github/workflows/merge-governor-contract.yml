name: PolaCore Merge Governor Contract

on:
  pull_request:
    branches: [engineering]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'config/merge_governor_policy_v1.json'
      - 'docs/automation/MERGE_CERTIFICATE.md'
      - 'docs/automation/MERGE_GOVERNOR.md'
      - 'docs/automation/MERGE_OBSERVATION.md'
      - 'scripts/merge_certificate_build.py'
      - 'scripts/merge_governor.py'
      - 'scripts/merge_observation_collect.py'
      - 'tests/test_merge_certificate_build.py'
      - 'tests/test_merge_governor.py'
      - 'tests/test_merge_observation_collect.py'
      - '.github/workflows/merge-governor-contract.yml'
  push:
    branches: [engineering]
    paths:
      - 'config/merge_governor_policy_v1.json'
      - 'docs/automation/MERGE_CERTIFICATE.md'
      - 'docs/automation/MERGE_GOVERNOR.md'
      - 'docs/automation/MERGE_OBSERVATION.md'
      - 'scripts/merge_certificate_build.py'
      - 'scripts/merge_governor.py'
      - 'scripts/merge_observation_collect.py'
      - 'tests/test_merge_certificate_build.py'
      - 'tests/test_merge_governor.py'
      - 'tests/test_merge_observation_collect.py'
      - '.github/workflows/merge-governor-contract.yml'

permissions:
  contents: read

jobs:
  deterministic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Parse workflow and strict policy JSON
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'psych'; Psych.parse_file(ARGV.fetch(0))" .github/workflows/merge-governor-contract.yml
          python3 -m json.tool config/merge_governor_policy_v1.json >/dev/null
          python3 -m py_compile \
            scripts/merge_certificate_build.py \
            scripts/merge_governor.py \
            scripts/merge_observation_collect.py \
            tests/test_merge_certificate_build.py \
            tests/test_merge_governor.py \
            tests/test_merge_observation_collect.py

      - name: Exercise positive and adversarial Governor contract
        shell: bash
        run: |
          python3 -m unittest -v \
            tests/test_merge_governor.py \
            tests/test_merge_observation_collect.py \
            tests/test_merge_certificate_build.py

      - name: Prove the candidate contract has no publication authority
        shell: bash
        run: |
          set -euo pipefail
          ruby - .github/workflows/merge-governor-contract.yml <<'RUBY'
          require 'psych'
          workflow = Psych.safe_load_file(ARGV.fetch(0), aliases: true)
          raise 'top-level workflow permission is not contents:read' unless workflow['permissions'] == {'contents' => 'read'}
          jobs = workflow.fetch('jobs')
          jobs.each_value do |job|
            permissions = job['permissions']
            raise 'job gained privileged permissions' unless permissions.nil? || permissions == {'contents' => 'read'}
            job.fetch('steps').each do |step|
              next if step['name'] == 'Prove the candidate contract has no publication authority'
              run = step['run'].to_s
              if run.match?(/gh\s+pr\s+merge|\/pulls\/.*\/merge|secrets:\s*inherit/)
                raise 'workflow gained a merge or inherited-secret command'
              end
            end
          end
          RUBY
          echo 'read-only exact-candidate contract verified; no merge authority is present.'
