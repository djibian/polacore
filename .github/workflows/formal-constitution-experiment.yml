name: Formal Constitution Experiment

on:
  pull_request:
    branches:
      - engineering
    paths:
      - 'experiments/formal-constitution/**'
      - '.github/workflows/formal-constitution-experiment.yml'
  push:
    branches:
      - codex/experiment/27-formal-security-constitution
    paths:
      - 'experiments/formal-constitution/**'
      - '.github/workflows/formal-constitution-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-constitution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERUS_VERSION: '0.2026.08.15.7d4628a'
      VERUS_ZIP_SHA256: '0467d3dd832e29d301abdd83d60237f0299d0a0acba3041388af066c8b31d1e4'
      VERUS_RUST_TOOLCHAIN: '1.97.1-x86_64-unknown-linux-gnu'
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact experiment revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Require exact checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected_sha=%s\nactual_sha=%s\n' "$TARGET_SHA" "$actual"
          test "$actual" = "$TARGET_SHA"

      - name: Reject proof shortcuts and caller preconditions
        run: python3 experiments/formal-constitution/check_proof_hygiene.py

      - name: Download and verify pinned Verus release
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/verus-lang/verus/releases/download/release%2F${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 3 --output /tmp/verus.zip "$url"
          actual="$(sha256sum /tmp/verus.zip | awk '{print $1}')"
          printf 'expected_verus_sha256=%s\nactual_verus_sha256=%s\n' "$VERUS_ZIP_SHA256" "$actual"
          test "$actual" = "$VERUS_ZIP_SHA256"
          unzip -q /tmp/verus.zip -d /tmp
          test -x /tmp/verus-x86-linux/verus

      - name: Install verifier-required Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$VERUS_RUST_TOOLCHAIN" --profile minimal

      - name: Record verifier and runner environment
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          rustup --version
          rustup run "$VERUS_RUST_TOOLCHAIN" rustc --version
          /tmp/verus-x86-linux/verus --version

      - name: Mechanically verify v0 pedagogical model
        shell: bash
        run: |
          set -euo pipefail
          /tmp/verus-x86-linux/verus \
            experiments/formal-constitution/constitution.rs \
            --expand-errors
          echo 'VERIFIED_BY_CI v0 obligations discharged; useful authority claim remains intentionally insufficient.'

      - name: Require rejection of v0 removed constitutional gate
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/formal-constitution/make_negative_control.py /tmp/constitution-broken.rs

          set +e
          /tmp/verus-x86-linux/verus /tmp/constitution-broken.rs --expand-errors \
            > /tmp/negative-control-v0.log 2>&1
          status=$?
          set -e

          cat /tmp/negative-control-v0.log
          if [ "$status" -eq 0 ]; then
            echo 'REFUTED: Verus accepted the deliberately unconstitutional v0 implementation.' >&2
            exit 1
          fi

          echo 'VERIFIED_BY_CI v0 negative control rejected.'

      - name: Mechanically verify v1 trusted-state capability kernel
        shell: bash
        run: |
          set -euo pipefail
          /tmp/verus-x86-linux/verus \
            experiments/formal-constitution/capability_kernel.rs \
            --expand-errors
          echo 'VERIFIED_BY_CI v1 trusted-state capability obligations discharged.'

      - name: Require rejection of v1 removed subject binding
        shell: bash
        run: |
          set -euo pipefail
          python3 experiments/formal-constitution/make_capability_negative_control.py \
            /tmp/capability-kernel-broken.rs

          set +e
          /tmp/verus-x86-linux/verus /tmp/capability-kernel-broken.rs --expand-errors \
            > /tmp/negative-control-v1.log 2>&1
          status=$?
          set -e

          cat /tmp/negative-control-v1.log
          if [ "$status" -eq 0 ]; then
            echo 'REFUTED: Verus accepted the subject-unbound v1 implementation.' >&2
            exit 1
          fi

          echo 'VERIFIED_BY_CI v1 negative control: verifier rejected removed subject binding.'
