name: PolaCore Reviewer Provider Evaluation Contract

on:
  push:
    branches:
      - codex/experiment/65-albert-reviewer-eval
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact Lab SHA with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compile and run deterministic scorer tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile scripts/reviewer_provider_eval.py tests/test_reviewer_provider_eval.py scripts/agent_reviewer_validate.py
          python3 -m unittest -v tests/test_reviewer_provider_eval.py

      - name: Materialize blind historical candidates
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            [H1]='86d66be36f4ea10a0a83b7fac1639951f1df72c1'
            [H2]='884ef3c07c9c19f13d11bbbe1dbc3211f748b586'
            [H3]='4236ed98f937b1e1fd9dcaefddffe711f0673a8f'
            [H4]='7fce52d8b8fd7e3a26e79d9609847f63a8fc38ce'
          )
          for case in H1 H2 H3 H4; do
            out="/tmp/provider-eval-${case}"
            rm -rf "$out"
            python3 scripts/reviewer_provider_eval.py materialize --case "$case" --out "$out"
            test -s "$out/reviewer-context.md"
            test -s "$out/candidate.py"
            grep -F "Exact candidate SHA: ${expected[$case]}" "$out/reviewer-context.md" >/dev/null
            ! grep -F 'c790315c92663aa7b15b9a626ae5d9fc07d3e378' "$out/reviewer-context.md"
            ! grep -F '9a653e50d1bec813ae738106cd65e0b2cde29dcb' "$out/reviewer-context.md"
            ! grep -F 'a821bcae50dadfd3f4d758056585162065d6ea30' "$out/reviewer-context.md"
          done

      - name: Prove inference workflow remains non-publishing
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/agent-reviewer-provider-eval.yml'
          agent='.opencode/agents/reviewer-provider-eval.md'
          grep -F 'workflow_dispatch:' "$workflow" >/dev/null
          ! grep -Eq '^  (push|pull_request|issues|issue_comment|schedule):' "$workflow"
          grep -F 'contents: read' "$workflow" >/dev/null
          grep -F 'pull-requests: read' "$workflow" >/dev/null
          grep -F "test \"\$GITHUB_REF\" = 'refs/heads/engineering'" "$workflow" >/dev/null
          grep -F 'persist-credentials: false' "$workflow" >/dev/null
          ! grep -Eq 'contents: write|pull-requests: write|issues: write|actions: write|checks: write|statuses: write' "$workflow"
          ! grep -Eq 'edit: allow|bash: allow|webfetch: allow|websearch: allow|task: allow' "$agent"
          ! grep -F 'c790315c92663aa7b15b9a626ae5d9fc07d3e378' "$agent"
          ! grep -F '9a653e50d1bec813ae738106cd65e0b2cde29dcb' "$agent"
          ! grep -F 'a821bcae50dadfd3f4d758056585162065d6ea30' "$agent"

      - name: Report dry-contract identity
        shell: bash
        run: |
          set -euo pipefail
          echo "lab_sha=$(git rev-parse HEAD)"
          sha256sum \
            scripts/reviewer_provider_eval.py \
            tests/test_reviewer_provider_eval.py \
            .opencode/agents/reviewer-provider-eval.md \
            .github/workflows/agent-reviewer-provider-eval.yml \
            .github/workflows/agent-reviewer-provider-eval-contract.yml
