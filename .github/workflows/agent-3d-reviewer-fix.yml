# Temporary deterministic patch; self-removes after applying exactly one Reviewer condition.
name: PolaCore 3D Reviewer Skip Fix

on:
  pull_request:
    branches: [engineering]
    types: [synchronize]
    paths:
      - '.github/workflows/agent-3d-reviewer-fix.yml'

permissions:
  contents: read

jobs:
  patch:
    if: github.event.pull_request.number == 37 && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Add explicit successful-final guard and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/agent-real-task-v1-contract.yml')
          text=path.read_text(encoding='utf-8')
          old="  reviewer-contract:\n    needs: final-contract\n    runs-on: ubuntu-24.04\n"
          new="  reviewer-contract:\n    needs: final-contract\n    if: always() && needs.final-contract.result == 'success'\n    runs-on: ubuntu-24.04\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Reviewer anchor, found {text.count(old)}')
          if "needs.final-contract.result == 'success'" in text:
              raise SystemExit('Reviewer explicit guard already present')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          ruby -e "require 'psych'; Psych.parse_file('.github/workflows/agent-real-task-v1-contract.yml')"
          grep -F "if: always() && needs.final-contract.result == 'success'" .github/workflows/agent-real-task-v1-contract.yml >/dev/null
          git rm .github/workflows/agent-3d-reviewer-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/agent-real-task-v1-contract.yml
          staged="$(git diff --cached --name-status | sort)"
          printf '%s\n' "$staged"
          test "$(printf '%s\n' "$staged" | wc -l)" -eq 2
          git commit -m 'fix: run Reviewer after successful final contract'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
