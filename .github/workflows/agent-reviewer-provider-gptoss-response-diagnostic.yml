name: PolaCore GPT-OSS Structured Response Diagnostic

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 65 &&
       github.event.issue.pull_request == null &&
       github.event.comment.body == '/diagnose-albert-gptoss-structured' &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require trusted invocation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/engineering' || { echo 'diagnostic must run from trusted engineering' >&2; exit 1; }
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" || { echo 'diagnostic requires repository owner invocation' >&2; exit 1; }

      - name: Checkout exact trusted invocation SHA with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch H1 candidate without credentials
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --no-recurse-submodules origin 86d66be36f4ea10a0a83b7fac1639951f1df72c1
          git cat-file -e '86d66be36f4ea10a0a83b7fac1639951f1df72c1^{commit}'

      - name: Verify unchanged deterministic transport contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile \
            scripts/reviewer_provider_eval.py \
            scripts/reviewer_provider_eval_gptoss.py \
            scripts/reviewer_provider_structured_transport.py \
            scripts/reviewer_provider_structured_transport_gptoss.py \
            scripts/agent_reviewer_validate.py \
            tests/test_reviewer_provider_eval.py \
            tests/test_reviewer_provider_structured_transport.py
          python3 -m unittest -v \
            tests/test_reviewer_provider_eval.py \
            tests/test_reviewer_provider_structured_transport.py

      - name: Require Albert secret
        env:
          ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
        shell: bash
        run: test -n "${ALBERT_API_KEY:-}" || { echo 'ALBERT_API_KEY is missing' >&2; exit 1; }

      - name: Verify GPT-OSS capability
        env:
          ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 \
            -H "Authorization: Bearer ${ALBERT_API_KEY}" \
            https://albert.api.etalab.gouv.fr/v1/models \
            | python3 -c 'import json,sys; ids={str(x.get("id")) for x in json.load(sys.stdin).get("data",[]) if x.get("id")}; assert "openai/gpt-oss-120b" in ids'

      - name: Request exact H1 structured response
        env:
          ALBERT_API_KEY: ${{ secrets.ALBERT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf agent-input
          python3 scripts/reviewer_provider_eval_gptoss.py materialize --case H1 --out agent-input
          bundle=/tmp/provider-eval-H1.prompt.txt
          {
            printf '%s\n' '=== TRUSTED CONTROL BEGIN ==='
            cat agent-input/reviewer-context.md
            printf '%s\n' '=== TRUSTED CONTROL END ==='
            for evidence in candidate.py candidate-tests.py candidate-provider.md; do
              if [ -s "agent-input/$evidence" ]; then
                printf '%s\n' "=== UNTRUSTED CANDIDATE EVIDENCE BEGIN: $evidence ==="
                cat "agent-input/$evidence"
                printf '%s\n' "=== UNTRUSTED CANDIDATE EVIDENCE END: $evidence ==="
              fi
            done
            printf '%s\n' 'Review only the bounded bundle above. Do not use tools. Return the exact Reviewer JSON contract.'
          } > "$bundle"
          python3 scripts/reviewer_provider_structured_transport_gptoss.py build-request \
            --bundle "$bundle" \
            --agent .opencode/agents/reviewer-provider-eval-gptoss.md \
            --out /tmp/provider-eval-H1.request.json
          curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 120 \
            -H "Authorization: Bearer ${ALBERT_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/provider-eval-H1.request.json \
            https://albert.api.etalab.gouv.fr/v1/chat/completions \
            >/tmp/provider-eval-H1.response.json

      - name: Report response envelope without model content
        shell: bash
        run: |
          set -euo pipefail
          python3 - /tmp/provider-eval-H1.response.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as fh:
              payload = json.load(fh)
          choices = payload.get('choices') if isinstance(payload, dict) else None
          choice = choices[0] if isinstance(choices, list) and len(choices) == 1 and isinstance(choices[0], dict) else None
          message = choice.get('message') if isinstance(choice, dict) else None
          content = message.get('content') if isinstance(message, dict) else None
          result = {
              'root_type': type(payload).__name__,
              'root_keys': sorted(payload.keys()) if isinstance(payload, dict) else [],
              'choices_type': type(choices).__name__,
              'choices_len': len(choices) if isinstance(choices, list) else None,
              'choice_keys': sorted(choice.keys()) if isinstance(choice, dict) else [],
              'finish_reason': choice.get('finish_reason') if isinstance(choice, dict) else None,
              'message_type': type(message).__name__,
              'message_keys': sorted(message.keys()) if isinstance(message, dict) else [],
              'content_type': type(content).__name__,
              'content_len': len(content) if isinstance(content, str) else None,
              'content_has_surrogate': any(0xD800 <= ord(ch) <= 0xDFFF for ch in content) if isinstance(content, str) else None,
          }
          print('response_envelope=' + json.dumps(result, ensure_ascii=True, separators=(',', ':')))
          PY

      - name: Capture extractor terminal exception only
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/reviewer_provider_structured_transport_gptoss.py extract-response \
            --response /tmp/provider-eval-H1.response.json \
            --out /tmp/provider-eval-H1.jsonl \
            >/tmp/provider-eval-H1.extract.stdout \
            2>/tmp/provider-eval-H1.extract.stderr
          status=$?
          set -e
          echo "extract_status=$status"
          if [ "$status" -eq 0 ]; then
            echo 'extract_exception_tail=NONE'
          else
            python3 - /tmp/provider-eval-H1.extract.stderr <<'PY'
          import json
          import sys
          from pathlib import Path

          lines = [line for line in Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace').splitlines() if line.strip()]
          tail = lines[-1] if lines else 'missing extractor stderr'
          print('extract_exception_tail=' + json.dumps(tail[:500], ensure_ascii=True))
          PY
          fi

      - name: Report trusted diagnostic identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'trusted_runner_sha=%s\nbase_transport_sha256=%s\nbinding_sha256=%s\nworkflow_sha256=%s\nmodel=openai/gpt-oss-120b\nauthority=diagnostic-only\n' \
            "$(git rev-parse HEAD)" \
            "$(sha256sum scripts/reviewer_provider_structured_transport.py | awk '{print $1}')" \
            "$(sha256sum scripts/reviewer_provider_structured_transport_gptoss.py | awk '{print $1}')" \
            "$(sha256sum .github/workflows/agent-reviewer-provider-gptoss-response-diagnostic.yml | awk '{print $1}')"
